<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Metrics — prototype</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
<style>[x-cloak]{display:none!important} body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}</style>
</head>
<body class="bg-zinc-50 text-zinc-900">
<div x-data="pm()" x-init="pmInit()" class="min-h-screen">
  <div x-show="pmError" x-cloak class="bg-red-50 border-b border-red-200 text-red-700 text-[12px] px-6 py-2">
    <span x-text="pmError"></span>
    <button @click="pmError = null; pmLoad()" class="underline ml-2">retry</button>
  </div>
<div class="px-6 pt-5 pb-8">

                  <!-- HEADER -->
                  <div class="flex items-end justify-between mb-4">
                    <div class="min-w-0">
                      <h1 class="text-[22px] font-semibold tracking-tight">Product Metrics</h1>
                      <p class="text-[13px] text-zinc-500 mt-0.5">Portfolio health — shared prototype; edits save to a live database</p>
                    </div>
                    <div class="flex items-center gap-2 flex-none">
                      <span class="text-[11px] text-zinc-400 px-1.5" x-show="pmLastSync">synced <span x-text="pmLastSync"></span></span>
                      <!-- COUNTRY FILTER -->
                      <div class="relative" @click.outside="pmCountryOpen = false">
                        <button @click="pmCountryOpen = !pmCountryOpen"
                                class="flex items-center gap-1.5 text-[12px] font-medium px-2.5 py-1.5 rounded-md bg-zinc-900 text-white hover:bg-zinc-800">
                          <span x-text="pmCountryLabel()"></span>
                          <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                        </button>
                        <div x-show="pmCountryOpen" x-cloak
                             class="absolute right-0 top-full mt-1.5 z-30 bg-white border border-zinc-200 rounded-xl shadow-lg p-1.5 min-w-[230px]">
                          <label class="flex items-center gap-2 text-[13px] text-zinc-900 px-2 py-1.5 rounded-md hover:bg-zinc-50 cursor-pointer">
                            <input type="checkbox" class="w-3.5 h-3.5 accent-zinc-900" :checked="pmAllCountries()" @change="pmToggleAllCountries()">
                            All countries
                          </label>
                          <div class="border-t border-zinc-200 my-1"></div>
                          <template x-for="co in pmCountries" :key="co.id">
                            <label class="flex items-center gap-2 text-[13px] text-zinc-900 px-2 py-1.5 rounded-md hover:bg-zinc-50 cursor-pointer whitespace-nowrap">
                              <input type="checkbox" class="w-3.5 h-3.5 accent-zinc-900" x-model="pmSelectedCountries[co.id]">
                              <span x-text="co.label"></span>
                            </label>
                          </template>
                        </div>
                      </div>
                      <!-- PERIOD (visual only) -->
                      <button class="flex items-center gap-1.5 text-[12px] px-2.5 py-1.5 rounded-md bg-white border border-zinc-200 hover:bg-zinc-50">
                        <svg class="w-3.5 h-3.5 text-zinc-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M8 2v4"/><path d="M16 2v4"/><path d="M3 10h18"/></svg>
                        Last 30 days
                        <svg class="w-3 h-3 text-zinc-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                      </button>
                    </div>
                  </div>

                  <!-- LEGEND -->
                  <div class="flex items-center gap-4 text-[12px] text-zinc-500 mb-4">
                    <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-emerald-600"></span>&gt;80% of target</span>
                    <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-amber-500"></span>50&ndash;80% of target</span>
                    <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-red-500"></span>&lt;50% of target</span>
                    <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full border border-zinc-300 bg-white"></span>no target</span>
                    <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full border border-dashed border-zinc-400"></span>not live</span>
                  </div>

                  <!-- TWO TABLES (Core products / Bets), one row model. Levels 1+2 are the
                       product_groups taxonomy (read-only names). Editing is explicit: the
                       hover pencil opens in-place inputs; the check button commits. -->
                  <template x-for="t in pmTables()" :key="t.key">
                    <div :class="t.key === 'bets' ? 'mt-6' : ''">
                      <div class="text-[15px] font-semibold tracking-tight text-zinc-900 mb-2" x-text="t.title"></div>
                      <div class="rounded-xl border border-zinc-200 bg-white overflow-hidden">

                        <div class="grid grid-cols-[minmax(280px,1.2fr)_1fr_1fr_1fr] border-b-2 border-zinc-200 text-[11px] uppercase tracking-wider text-zinc-400 font-semibold">
                          <div class="px-4 py-2.5">Product</div>
                          <div class="px-4 py-2.5 border-l border-zinc-200">Activation</div>
                          <div class="px-4 py-2.5 border-l border-zinc-200">Usage</div>
                          <div class="px-4 py-2.5 border-l border-zinc-200">Friction</div>
                        </div>

                        <template x-for="row in pmRowsFor(t.key)" :key="row.key">
                          <div>

                            <!-- NODE ROW (level 1 or 2 — taxonomy, name read-only) -->
                            <template x-if="row.kind === 'node'">
                              <div @click="pmToggleNode(t.key, row.node)"
                                   :class="row.depth === 0 ? 'bg-zinc-50/70 hover:bg-zinc-100' : 'hover:bg-zinc-50'"
                                   class="grid grid-cols-[minmax(280px,1.2fr)_1fr_1fr_1fr] border-b border-zinc-200 cursor-pointer">
                                <div :class="row.depth === 0 ? '' : 'pl-7'" class="px-4 py-2.5 flex items-center gap-2 flex-wrap">
                                  <svg :class="[pmNodeExpanded(t.key, row.node) ? 'rotate-90' : '', row.depth === 0 ? 'w-3.5 h-3.5' : 'w-3 h-3']"
                                       class="text-zinc-400 transition-transform flex-none"
                                       viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                                  <span :class="row.depth === 0 ? 'text-[14px] text-zinc-900' : 'text-[13px] text-zinc-800'"
                                        class="font-semibold" x-text="row.node.name"></span>
                                  <span x-show="t.key === 'bets' && row.depth === 0"
                                        class="text-[8.5px] font-mono uppercase tracking-wide px-1 py-0.5 rounded bg-indigo-50 text-indigo-700">Bet</span>
                                  <span x-show="row.node.status === 'draft'"
                                        class="text-[8.5px] font-mono uppercase tracking-wide px-1 py-0.5 rounded bg-zinc-100 text-zinc-500">Coming soon</span>
                                  <span x-show="pmBlurb(row.node.id)" class="basis-full text-[11px] text-zinc-400 font-normal pl-5" x-text="pmBlurb(row.node.id)"></span>
                                </div>
                                <template x-for="col in pmColumns" :key="row.node.id + '-' + col">
                                  <div @click.stop
                                       :class="pmEditingCell === (row.node.id + '|' + col) ? 'bg-white' : (pmCell(row.node.id, col) ? pmCellBg(pmCell(row.node.id, col), col) : 'bg-zinc-50/50')"
                                       class="group/cell relative px-4 py-2.5 border-l border-zinc-200 flex flex-col justify-center cursor-default">

                                    <!-- display mode -->
                                    <template x-if="pmEditingCell !== (row.node.id + '|' + col)">
                                      <div>
                                        <template x-if="pmCell(row.node.id, col)">
                                          <div>
                                            <span class="flex items-center gap-1.5">
                                              <span x-show="pmRag(pmCell(row.node.id, col), col)" :class="pmDot(pmCell(row.node.id, col), col)" class="w-2 h-2 rounded-full flex-none"></span>
                                              <span :class="row.depth === 0 ? 'text-[16px] text-zinc-900' : 'text-[14px] text-zinc-800'"
                                                    class="font-semibold tracking-tight" x-text="pmCell(row.node.id, col).value"></span>
                                            </span>
                                            <span class="block text-[11px] text-zinc-500 mt-0.5"
                                                  x-text="'target ' + (pmCell(row.node.id, col).target || '—') + (pmCell(row.node.id, col).caption ? ' · ' + pmCell(row.node.id, col).caption : '')"></span>
                                          </div>
                                        </template>
                                        <template x-if="!pmCell(row.node.id, col)">
                                          <span class="flex items-center gap-1.5 text-[11px] text-zinc-400">
                                            <span class="w-2 h-2 rounded-full border border-dashed border-zinc-400 flex-none"></span> not live
                                          </span>
                                        </template>
                                        <button @click.stop="pmStartCellEdit(row.node.id, col)" title="Edit metric and target"
                                                class="absolute top-1.5 right-1.5 p-1 rounded hover:bg-white/80 text-zinc-400 hover:text-zinc-700 opacity-0 group-hover/cell:opacity-100">
                                          <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/></svg>
                                        </button>
                                      </div>
                                    </template>

                                    <!-- edit mode: same layout, inputs in place, check commits -->
                                    <template x-if="pmEditingCell === (row.node.id + '|' + col)">
                                      <div @keydown.enter.stop="pmSaveCellEdit()" @keydown.escape.stop="pmCancelCellEdit()">
                                        <span class="flex items-center gap-1.5 pr-14">
                                          <input x-model="pmDraftCell.value" x-init="$el.focus(); $el.select()" placeholder="Value" @click.stop
                                                 :class="row.depth === 0 ? 'text-[16px]' : 'text-[14px]'"
                                                 class="w-24 min-w-0 font-semibold tracking-tight border border-zinc-300 rounded px-1 bg-white">
                                        </span>
                                        <span class="text-[11px] text-zinc-500 mt-1 flex items-center gap-1 flex-wrap">
                                          <span>target</span>
                                          <input x-model="pmDraftCell.target" placeholder="Target" @click.stop
                                                 class="w-16 text-[11px] border border-zinc-300 rounded px-1 bg-white">
                                          <input x-model="pmDraftCell.caption" placeholder="Description" @click.stop
                                                 class="flex-1 min-w-[110px] text-[11px] border border-zinc-300 rounded px-1 bg-white">
                                        </span>
                                        <span class="absolute top-1.5 right-1.5 flex items-center gap-0.5">
                                          <button @click.stop="pmSaveCellEdit()" title="Save"
                                                  class="p-1 rounded bg-lime-400 hover:bg-lime-500 text-zinc-900">
                                            <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
                                          </button>
                                          <button @click.stop="pmCancelCellEdit()" title="Cancel"
                                                  class="p-1 rounded hover:bg-zinc-100 text-zinc-400 hover:text-zinc-700">
                                            <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                                          </button>
                                        </span>
                                      </div>
                                    </template>
                                  </div>
                                </template>
                              </div>
                            </template>

                            <!-- METRIC ROW (level 3 — row pencil edits the label; every column
                                 cell has its own contextual editor, independent of the others) -->
                            <template x-if="row.kind === 'metric'">
                              <div class="group/mrow grid grid-cols-[minmax(280px,1.2fr)_1fr_1fr_1fr] border-b border-zinc-100">
                                <div :class="row.depth === 1 ? 'pl-9' : 'pl-12'" class="px-4 py-2 text-[12px] text-zinc-500 flex items-center gap-2"
                                     @keydown.enter.stop="pmSaveMetricEdit()" @keydown.escape.stop="pmCancelMetricEdit()">
                                  <template x-if="pmEditingMetricId === row.metric.id">
                                    <input x-model="pmDraftMetric.label" x-init="$el.focus(); $el.select()"
                                           class="flex-1 min-w-0 text-[12px] border border-zinc-300 rounded px-1.5 py-0.5 bg-white">
                                  </template>
                                  <template x-if="pmEditingMetricId !== row.metric.id">
                                    <span x-text="row.metric.label"></span>
                                  </template>
                                  <span class="ml-auto flex items-center gap-0.5 flex-none">
                                    <template x-if="pmEditingMetricId === row.metric.id">
                                      <span class="flex items-center gap-0.5">
                                        <button @click="pmSaveMetricEdit()" title="Save"
                                                class="p-1 rounded bg-lime-400 hover:bg-lime-500 text-zinc-900">
                                          <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
                                        </button>
                                        <button @click="pmCancelMetricEdit()" title="Cancel"
                                                class="p-1 rounded hover:bg-zinc-100 text-zinc-400 hover:text-zinc-700">
                                          <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                                        </button>
                                        <button @click="pmDeleteMetric(row.metric.id)" title="Delete metric"
                                                class="p-1 rounded hover:bg-red-50 text-zinc-400 hover:text-red-600">
                                          <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                                        </button>
                                      </span>
                                    </template>
                                    <template x-if="pmEditingMetricId !== row.metric.id">
                                      <button @click="pmStartMetricEdit(row.metric)" title="Edit metric name"
                                              class="p-1 rounded hover:bg-zinc-100 text-zinc-400 hover:text-zinc-700 opacity-0 group-hover/mrow:opacity-100">
                                        <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/></svg>
                                      </button>
                                    </template>
                                  </span>
                                </div>
                                <template x-for="col in pmColumns" :key="row.metric.id + '-' + col">
                                  <div :class="pmEditingCell === (row.metric.id + '|' + col) ? 'bg-white' : (pmCell(row.metric.id, col) ? pmCellBg(pmCell(row.metric.id, col), col) : '')"
                                       class="group/cell relative px-4 py-2 border-l border-zinc-100 flex flex-col justify-center">

                                    <!-- display mode -->
                                    <template x-if="pmEditingCell !== (row.metric.id + '|' + col)">
                                      <div class="flex items-center pr-8">
                                        <template x-if="pmCell(row.metric.id, col)">
                                          <span class="flex items-center gap-1.5 text-[12px]">
                                            <span x-show="pmRag(pmCell(row.metric.id, col), col)" :class="pmDot(pmCell(row.metric.id, col), col)" class="w-2 h-2 rounded-full flex-none"></span>
                                            <span class="font-semibold text-zinc-800" x-text="pmCell(row.metric.id, col).value"></span>
                                            <span class="text-[11px] text-zinc-400"
                                                  x-text="'target ' + (pmCell(row.metric.id, col).target || '—') + (pmCell(row.metric.id, col).caption ? ' · ' + pmCell(row.metric.id, col).caption : '')"></span>
                                          </span>
                                        </template>
                                        <template x-if="!pmCell(row.metric.id, col)">
                                          <span class="text-[12px] text-zinc-300">—</span>
                                        </template>
                                        <button @click.stop="pmStartCellEdit(row.metric.id, col)" title="Edit metric and target"
                                                class="absolute top-1/2 -translate-y-1/2 right-1.5 p-1 rounded hover:bg-zinc-100 text-zinc-400 hover:text-zinc-700 opacity-0 group-hover/cell:opacity-100">
                                          <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/></svg>
                                        </button>
                                      </div>
                                    </template>

                                    <!-- edit mode -->
                                    <template x-if="pmEditingCell === (row.metric.id + '|' + col)">
                                      <div @keydown.enter.stop="pmSaveCellEdit()" @keydown.escape.stop="pmCancelCellEdit()"
                                           class="flex items-center gap-1.5 pr-14 flex-wrap">
                                        <input x-model="pmDraftCell.value" x-init="$el.focus(); $el.select()" placeholder="Value" @click.stop
                                               class="w-16 text-[12px] font-semibold border border-zinc-300 rounded px-1 bg-white">
                                        <span class="text-[11px] text-zinc-400">target</span>
                                        <input x-model="pmDraftCell.target" placeholder="Target" @click.stop
                                               class="w-16 text-[11px] border border-zinc-300 rounded px-1 bg-white">
                                        <input x-model="pmDraftCell.caption" placeholder="Description" @click.stop
                                               class="flex-1 min-w-[90px] text-[11px] border border-zinc-300 rounded px-1 bg-white">
                                        <span class="absolute top-1/2 -translate-y-1/2 right-1.5 flex items-center gap-0.5">
                                          <button @click.stop="pmSaveCellEdit()" title="Save"
                                                  class="p-1 rounded bg-lime-400 hover:bg-lime-500 text-zinc-900">
                                            <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
                                          </button>
                                          <button @click.stop="pmCancelCellEdit()" title="Cancel"
                                                  class="p-1 rounded hover:bg-zinc-100 text-zinc-400 hover:text-zinc-700">
                                            <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                                          </button>
                                        </span>
                                      </div>
                                    </template>
                                  </div>
                                </template>
                              </div>
                            </template>

                            <!-- ADD METRIC ROW (label only — cells are filled per column afterwards) -->
                            <template x-if="row.kind === 'add'">
                              <div>
                                <div x-show="pmAddingFor === row.subGroupId" x-cloak
                                     @keydown.enter.stop="pmSaveNewMetric()" @keydown.escape.stop="pmCancelAddMetric()"
                                     :class="row.depth === 1 ? 'pl-9' : 'pl-12'"
                                     class="border-b border-zinc-100 bg-zinc-50/70 px-4 py-2 flex items-center gap-2">
                                  <input x-model="pmDraftMetric.label" placeholder="Metric name" class="flex-1 min-w-[220px] text-[12px] border border-zinc-200 rounded-md px-2 py-1 bg-white">
                                  <button @click="pmSaveNewMetric()"
                                          :class="pmDraftMetric.label.trim() ? 'bg-lime-400 hover:bg-lime-500 text-zinc-900' : 'bg-zinc-100 text-zinc-400 cursor-not-allowed'"
                                          class="text-[12px] font-semibold px-2.5 py-1 rounded-md">Save</button>
                                  <button @click="pmCancelAddMetric()" class="text-[12px] text-zinc-500 hover:text-zinc-800 px-1.5 py-1">Cancel</button>
                                </div>
                                <div x-show="pmAddingFor !== row.subGroupId" class="border-b border-zinc-100">
                                  <button @click="pmStartAddMetric(row.subGroupId)"
                                          :class="row.depth === 1 ? 'pl-9' : 'pl-12'"
                                          class="w-full text-left px-4 py-1.5 text-[12px] text-zinc-400 hover:text-zinc-700 hover:bg-zinc-50 flex items-center gap-1.5">
                                    <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                                    Add metric
                                  </button>
                                </div>
                              </div>
                            </template>

                          </div>
                        </template>
                      </div>
                    </div>
                  </template>

                </div>
</div>
<script>

const HIDDEN_GROUPS = new Set(['Risk', 'Financial Shared Services', 'Operational Platform', 'GMD & Teya ID']);
const BET_GROUPS = new Set(['Teya AI']);
const BET_SUBS = new Set(['Cash Advance', 'Loan (1P)', 'Teya E-POS']);
const BET_LONE = new Set(['Teya E-POS']);

const BLURBS = {
  'Card machine': 'Take payments in person — terminals and Tap to Pay, with tips and split bill built in',
  'Settling preferences': 'Settlement frequency (instant, everyday, scheduled), sales & settlement reports, settlement bank accounts',
  'Pay By Link': 'Send a secure payment link by text, email, or chat',
  'E-Commerce': 'Sell online with hosted checkout, Shopify, and WooCommerce',
  'MOTO': 'Take card payments over the phone',
  'Integrations': 'Connect the ePOS, e-commerce, and accounting tools you already use',
  'Account': 'Settlement, balances, local details and team access',
  'Business Cards': 'Create multiple cards with 0.5% cashback on all spend',
  'Transfers': 'Send money, schedule payments, and set approvals',
  'Bill Payments': 'Upload an invoice and pay it straight from your account',
  'Savings': 'Earn interest on spare funds, with instant access',
  'Credit Marketplace (3P)': "Credit through Teya's lending partners, arranged in the app",
  'App': 'Reports, analytics, and actions in one place',
  'Teams and Permissions': 'Choose what each team member can see and do',
};

const COUNTRIES = [
  { id: 'uk', label: '🇬🇧 United Kingdom' },
  { id: 'hr', label: '🇭🇷 Croatia' },
  { id: 'cz-sk', label: '🇨🇿🇸🇰 Czech + Slovakia' },
  { id: 'hu', label: '🇭🇺 Hungary' },
  { id: 'is', label: '🇮🇸 Iceland' },
  { id: 'it', label: '🇮🇹 Italy' },
  { id: 'pt', label: '🇵🇹 Portugal' },
  { id: 'es', label: '🇪🇸 Spain' },
];

const RAG_DOT = { green: 'bg-emerald-600', amber: 'bg-amber-500', red: 'bg-red-500' };
const RAG_BG = { green: 'bg-emerald-50', amber: 'bg-amber-50', red: 'bg-red-50' };

// First number in a formatted string ("€15,400" → 15400, "93%" → 93). null if none.
function parseNum(s) {
  const m = String(s ?? '').replace(/,/g, '').match(/-?\d+(\.\d+)?/);
  return m ? parseFloat(m[0]) : null;
}

function pm() {
  return {
    pmCells: {},        // { [entityId]: { [col]: row } }
    pmMetricRows: [],   // [{ id, sub_group_id, label }]
    pmColumns: ['activation', 'usage', 'friction'],
    pmCountries: COUNTRIES,
    pmSelectedCountries: Object.fromEntries(COUNTRIES.map((c) => [c.id, true])),
    pmExpandedNodes: {},
    pmCountryOpen: false,
    pmError: null,
    pmLastSync: '',
    pmEditingCell: null,
    pmDraftCell: { rag: 'green', value: '', target: '', caption: '' },
    pmEditingMetricId: null,
    pmAddingFor: null,
    pmDraftMetric: { label: '', subGroupId: '' },

    async pmInit() {
      await this.pmLoad();
      // Poll so other people's edits show up; skip a tick while someone is mid-edit here.
      setInterval(() => {
        if (!this.pmEditingCell && !this.pmEditingMetricId && this.pmAddingFor === null) this.pmLoad();
      }, 8000);
    },

    async sb(path, opts = {}) {
      const res = await fetch(`${SB_URL}/rest/v1/${path}`, {
        method: opts.method || 'GET',
        headers: {
          apikey: SB_KEY,
          Authorization: `Bearer ${SB_KEY}`,
          'Content-Type': 'application/json',
          ...(opts.prefer ? { Prefer: opts.prefer } : {}),
        },
        body: opts.body,
      });
      if (!res.ok) throw new Error(`Save failed (${res.status}) — check your connection and retry`);
      const text = await res.text();
      return text ? JSON.parse(text) : null;
    },

    async pmLoad() {
      try {
        const [cells, metrics] = await Promise.all([
          this.sb('pm_cells?select=*'),
          this.sb('pm_metrics?select=*&order=created_at'),
        ]);
        const byEntity = {};
        for (const r of cells) (byEntity[r.entity_id] ??= {})[r.col] = r;
        this.pmCells = byEntity;
        this.pmMetricRows = metrics;
        this.pmError = null;
        this.pmLastSync = new Date().toLocaleTimeString();
      } catch (e) {
        this.pmError = String(e.message || e);
      }
    },

    // ---- tables (same shape as the mvp module) ----
    pmTables() {
      return [
        { key: 'core', title: 'Core products' },
        { key: 'bets', title: 'Bets' },
      ];
    },

    pmRowsFor(table) {
      const rows = [];
      const expanded = (id) => this.pmExpandedNodes[`${table}:${id}`];
      const pushMetrics = (subGroupId, depth) => {
        for (const metric of this.pmMetricsFor(subGroupId)) rows.push({ key: metric.id, kind: 'metric', metric, depth });
        rows.push({ key: `${subGroupId}:add`, kind: 'add', subGroupId, depth });
      };
      const pushSub = (s) => {
        rows.push({ key: s.id, kind: 'node', node: s, depth: 1 });
        if (expanded(s.id)) pushMetrics(s.id, 2);
      };
      for (const g of TAXONOMY) {
        if (HIDDEN_GROUPS.has(g.name)) continue;
        const isBetGroup = BET_GROUPS.has(g.name);
        const subs = table === 'core'
          ? (isBetGroup ? [] : g.subs.filter((s) => !BET_SUBS.has(s.name)))
          : (isBetGroup ? g.subs : g.subs.filter((s) => BET_SUBS.has(s.name) && !BET_LONE.has(s.name)));
        const belongs = table === 'core' ? !isBetGroup : (isBetGroup || subs.length > 0);
        if (!belongs) continue;
        rows.push({ key: g.id, kind: 'node', node: { ...g, type: 'group' }, depth: 0 });
        if (expanded(g.id)) subs.forEach(pushSub);
      }
      if (table === 'bets') {
        for (const g of TAXONOMY) for (const s of g.subs) if (BET_LONE.has(s.name)) {
          rows.push({ key: s.id, kind: 'node', node: s, depth: 0 });
          if (expanded(s.id)) pushMetrics(s.id, 1);
        }
      }
      return rows;
    },

    pmToggleNode(table, node) {
      const key = `${table}:${node.id}`;
      this.pmExpandedNodes[key] = !this.pmExpandedNodes[key];
    },

    pmNodeExpanded(table, node) {
      return !!this.pmExpandedNodes[`${table}:${node.id}`];
    },

    // ---- reads ----
    pmCell(entityId, col) {
      return this.pmCells[entityId]?.[col] ?? null;
    },

    pmMetricsFor(subGroupId) {
      return this.pmMetricRows.filter((r) => r.sub_group_id === subGroupId);
    },

    pmBlurb(nodeId) {
      for (const g of TAXONOMY) for (const s of g.subs) if (s.id === nodeId) return BLURBS[s.name] ?? '';
      return '';
    },

    // RAG is DERIVED from target attainment, recomputed on every save:
    // >80% green, 50–80% amber, <50% red; no parseable value/target → no colour.
    // Friction counts inverted (below target = good) unless the target carries '↑';
    // a '↓' in any target forces lower-is-better.
    pmAtt(cell, col) {
      if (!cell) return null;
      const v = parseNum(cell.value), t = parseNum(cell.target);
      if (v === null || t === null || t === 0) return null;
      const lowerBetter = cell.target.includes('↓') || (col === 'friction' && !cell.target.includes('↑'));
      if (lowerBetter) return v === 0 ? 999 : t / v;
      return v / t;
    },
    pmRag(cell, col) {
      const r = this.pmAtt(cell, col);
      if (r === null) return null;
      return r > 0.80 ? 'green' : (r >= 0.50 ? 'amber' : 'red');
    },
    pmDot(cell, col) { const r = this.pmRag(cell, col); return r ? RAG_DOT[r] : ''; },
    pmCellBg(cell, col) { const r = this.pmRag(cell, col); return r ? RAG_BG[r] : 'bg-white'; },

    // ---- cell editing (pencil opens, check commits — writes straight to the DB) ----
    pmStartCellEdit(entityId, col) {
      const cur = this.pmCell(entityId, col);
      this.pmDraftCell = cur
        ? { rag: cur.rag, value: cur.value, target: cur.target, caption: cur.caption }
        : { rag: 'green', value: '', target: '', caption: '' };
      this.pmEditingMetricId = null;
      this.pmAddingFor = null;
      this.pmEditingCell = `${entityId}|${col}`;
    },

    async pmSaveCellEdit() {
      if (!this.pmEditingCell) return;
      const [entityId, col] = this.pmEditingCell.split('|');
      const value = this.pmDraftCell.value.trim();
      try {
        if (!value) {
          await this.sb(`pm_cells?entity_id=eq.${entityId}&col=eq.${col}`, { method: 'DELETE' });
          if (this.pmCells[entityId]) delete this.pmCells[entityId][col];
        } else {
          // rag column is legacy — colour is derived client-side from value vs target.
          const row = { entity_id: entityId, col, rag: 'green', value, target: this.pmDraftCell.target.trim(), caption: this.pmDraftCell.caption.trim() };
          await this.sb('pm_cells', { method: 'POST', prefer: 'resolution=merge-duplicates', body: JSON.stringify(row) });
          (this.pmCells[entityId] ??= {})[col] = row;
        }
        this.pmEditingCell = null;
      } catch (e) {
        this.pmError = String(e.message || e);
      }
    },

    pmCancelCellEdit() { this.pmEditingCell = null; },

    // ---- metric label editing ----
    pmStartMetricEdit(metric) {
      this.pmDraftMetric = { label: metric.label, subGroupId: metric.sub_group_id };
      this.pmEditingCell = null;
      this.pmAddingFor = null;
      this.pmEditingMetricId = metric.id;
    },

    async pmSaveMetricEdit() {
      const label = this.pmDraftMetric.label.trim();
      const row = this.pmMetricRows.find((r) => r.id === this.pmEditingMetricId);
      if (!row || !label) return;
      try {
        await this.sb(`pm_metrics?id=eq.${row.id}`, { method: 'PATCH', body: JSON.stringify({ label }) });
        row.label = label;
        this.pmEditingMetricId = null;
      } catch (e) {
        this.pmError = String(e.message || e);
      }
    },

    pmCancelMetricEdit() { this.pmEditingMetricId = null; },

    // ---- metric create/delete ----
    pmStartAddMetric(subGroupId) {
      this.pmEditingCell = null;
      this.pmEditingMetricId = null;
      this.pmDraftMetric = { label: '', subGroupId };
      this.pmAddingFor = subGroupId;
    },

    async pmSaveNewMetric() {
      const d = this.pmDraftMetric;
      if (!d.label.trim()) return;
      const row = { id: crypto.randomUUID(), sub_group_id: d.subGroupId, label: d.label.trim() };
      try {
        await this.sb('pm_metrics', { method: 'POST', body: JSON.stringify(row) });
        this.pmMetricRows.push(row);
        this.pmAddingFor = null;
      } catch (e) {
        this.pmError = String(e.message || e);
      }
    },

    pmCancelAddMetric() { this.pmAddingFor = null; },

    async pmDeleteMetric(id) {
      try {
        await this.sb(`pm_cells?entity_id=eq.${id}`, { method: 'DELETE' });
        await this.sb(`pm_metrics?id=eq.${id}`, { method: 'DELETE' });
        const i = this.pmMetricRows.findIndex((r) => r.id === id);
        if (i >= 0) this.pmMetricRows.splice(i, 1);
        if (this.pmEditingMetricId === id) this.pmEditingMetricId = null;
        delete this.pmCells[id];
      } catch (e) {
        this.pmError = String(e.message || e);
      }
    },

    // ---- country filter (selection only, mirrors the mockup) ----
    pmAllCountries() {
      return this.pmCountries.every((c) => this.pmSelectedCountries[c.id]);
    },

    pmToggleAllCountries() {
      const next = !this.pmAllCountries();
      for (const c of this.pmCountries) this.pmSelectedCountries[c.id] = next;
    },

    pmCountryLabel() {
      const sel = this.pmCountries.filter((c) => this.pmSelectedCountries[c.id]);
      if (sel.length === this.pmCountries.length) return 'All countries';
      if (sel.length === 0) return 'No countries';
      if (sel.length === 1) return sel[0].label;
      return `${sel.length} countries`;
    },
  };
}
</script>
